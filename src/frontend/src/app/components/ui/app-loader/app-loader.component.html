<div class="flex flex-col items-center justify-center gap-4 p-6">

  <div class="loader"></div>

  <div *ngIf="message" class="text-center space-y-1 animate-pulse">
    <h3 class="text-lg font-bold text-text-main">{{ message }}</h3>
    <p *ngIf="subMessage" class="text-sm text-text-muted">{{ subMessage }}</p>
  </div>

</div>
