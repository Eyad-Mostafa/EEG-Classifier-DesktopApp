<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <style>
    body {
      background-color: #2d2d2d;
      color: white;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      margin: 0;

      box-sizing: border-box;

      overflow: hidden;

      border-radius: 10px;
      border: 1px solid #444;

      /* Optional: Prevent selecting text on splash */
      user-select: none;
    }

    .spinner {
      border: 4px solid rgba(255, 255, 255, 0.1);
      width: 40px;
      height: 40px;
      border-radius: 50%;
      border-left-color: #6200ea;
      animation: spin 1s linear infinite;
      margin-bottom: 20px;
    }

    @keyframes spin {
      0% {
        transform: rotate(0deg);
      }

      100% {
        transform: rotate(360deg);
      }
    }

    h2 {
      margin: 0;
      font-size: 24px;
    }

    p {
      color: #aaa;
      font-size: 14px;
      margin-top: 10px;
    }
  </style>
</head>

<body>
  <div class="spinner"></div>
  <h2>EEG Classifier</h2>
  <p>Initializing Analysis Engine...</p>
</body>

</html>
